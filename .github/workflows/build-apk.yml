name: Gerar APK Android

on:
  push:
    branches: [ main, master, principal ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependências e gerar build Web
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Configurar Capacitor e criar projeto Android
        run: |
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 --legacy-peer-deps
          rm -f capacitor.config.ts capacitor.config.js capacitor.config.json
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.solaris.jogo",
            "appName": "Solaris",
            "webDir": "dist",
            "backgroundColor": "#0B1320"
          }
          EOF
          npx cap add android
          npx cap sync
      - name: Aplicar ícone do jogo no Android
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          mkdir -p assets
          convert favicon.ico -thumbnail 1024x1024 -alpha on -background none -flatten assets/logo.png
          npm install -D @capacitor/assets --legacy-peer-deps
          npx capacitor-assets generate --android
      - name: Configurar Tela Cheia Real e Rotação Livre
        run: |
          sed -i 's/android:screenOrientation="[^"]*"/android:screenOrientation="fullSensor"/g' android/app/src/main/AndroidManifest.xml
          cat << 'EOF' > android/app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>
                  <item name="android:windowBackground">#0B1320</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">@android:color/transparent</item>
              </style>
              <style name="AppTheme.NoActionBarLaunch" parent="AppTheme">
                  <item name="android:background">#0B1320</item>
              </style>
          </resources>
          EOF

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: Solaris-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
