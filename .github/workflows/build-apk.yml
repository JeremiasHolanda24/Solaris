name: Gerar APK Android

on:
  push:
    branches: [ main, master, principal ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependências e gerar build Web
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Configurar Capacitor e criar projeto Android
        run: |
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 --legacy-peer-deps
          rm -f capacitor.config.ts capacitor.config.js capacitor.config.json
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.solaris.jogo",
            "appName": "Solaris",
            "webDir": "dist"
          }
          EOF
          npx cap add android
          if [ -f "icon.png" ]; then
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
            for dir in android/app/src/main/res/mipmap-*; do
              cp icon.png "$dir/ic_launcher.png"
              cp icon.png "$dir/ic_launcher_round.png"
              cp icon.png "$dir/ic_launcher_foreground.png"
            done
          fi
          npx cap sync

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: Solaris-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
