name: Gerar APK Android

on:
  push:
    branches: [ main, master, principal ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependências e gerar build Web
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Configurar Capacitor e criar projeto Android
        run: |
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/assets --legacy-peer-deps
          rm -f capacitor.config.ts capacitor.config.js capacitor.config.json
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.solaris.jogo",
            "appName": "Solaris",
            "webDir": "dist"
          }
          EOF
          npx cap add android
          mkdir -p assets
          if [ -f "icon.png" ]; then
            cp icon.png assets/icon-only.png
            cp icon.png assets/icon-foreground.png
            npx capacitor-assets generate --android
          fi
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="landscape"/g' android/app/src/main/AndroidManifest.xml
          npx cap sync

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: Solaris-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
